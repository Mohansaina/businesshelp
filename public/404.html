<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - AI Review & Reputation Tool</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
            <div class="error-actions">
                <button class="btn btn-primary" onclick="window.location.href='/'">Go to Homepage</button>
                <button class="btn btn-outline" onclick="window.history.back()">Go Back</button>
            </div>
        </div>
    </div>
</body>
</html>
